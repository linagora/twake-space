<!doctype html>
<html lang="en" class="u-h-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The SVG icon comes from html.favicon; the ICO stays for the browsers
    without SVG icons, and sizes lets the others pick the SVG. -->
    <link rel="icon" href="<%= assetPrefix %>/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/icons/Icon-192.png" />
    <title>Twake Space</title>
    <script src="<%= assetPrefix %>/.env.js"></script>
    <!-- The sign-in screen paints before any script runs; SignInScreen takes it over. -->
    <style>
      /* The same screen as Twake Project's loader, with our icon */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Scrolls in a frame too small for the sign-in buttons */
        justify-content: safe center;
        overflow: auto;
        padding: 16px 16px 98px;
        background: #fff;
        color: #424244;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
        transition: opacity 200ms ease-out;
      }
      .splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .splash-icon {
        display: block;
        width: 108px;
        height: 108px;
        animation: splash-grow 300ms ease-out 300ms both;
      }
      .splash-icon svg,
      .splash-icon img {
        display: block;
        width: 100%;
        height: 100%;
      }
      @keyframes splash-grow {
        from {
          transform: scale(0.72);
        }
        to {
          transform: scale(1);
        }
      }
      .splash-workplace {
        position: absolute;
        bottom: 50px;
        left: 50%;
        width: 210px;
        transform: translateX(-50%);
      }
      .splash-status {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .splash-title {
        margin: 16px 0 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.4;
      }
      .splash-hint {
        max-width: 320px;
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 20px;
        color: rgba(66, 66, 68, 0.64);
      }
      .splash-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition-duration: 1ms;
        }
        .splash-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="u-h-100">
    <noscript>You need to enable JavaScript to run Twake Space.</noscript>
    <div id="splash" class="splash">
      <span class="splash-icon" aria-hidden="true"><%= spaceIcon %></span>
      <p class="splash-status" role="status"></p>
      <span class="splash-workplace" aria-hidden="true"
        ><%= workplaceLogo %></span
      >
    </div>
    <div id="root" class="u-h-100"></div>
  </body>
</html>
