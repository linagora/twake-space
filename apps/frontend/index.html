<!doctype html>
<html lang="en" class="u-h-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The SVG icon comes from html.favicon; the ICO stays for the browsers
    without SVG icons, and sizes lets the others pick the SVG. -->
    <link rel="icon" href="<%= assetPrefix %>/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/icons/Icon-192.png" />
    <title>Twake Space</title>
    <script src="<%= assetPrefix %>/.env.js"></script>
    <!-- The sign-in screen paints before any script runs; SignInScreen renders the same markup. -->
    <style>
      .splash {
        --splash-bg: #f3f6f9;
        --splash-text: #424244;
        --splash-muted: rgba(66, 66, 68, 0.64);
        position: fixed;
        inset: 0;
        z-index: 1400;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          --splash-bg: #2c3039;
          --splash-text: #fff;
          --splash-muted: rgba(255, 255, 255, 0.64);
        }
      }
      .splash-leaving {
        pointer-events: none;
        animation: splash-out 200ms ease-out forwards;
      }
      @keyframes splash-out {
        to {
          opacity: 0;
        }
      }
      .splash-mark {
        display: block;
        width: 64px;
        height: 64px;
      }
      .splash-face {
        opacity: 0.35;
        animation: splash-face 2s ease-in-out var(--splash-delay, 0s) infinite;
      }
      .splash-face + .splash-face {
        animation-delay: calc(var(--splash-delay, 0s) + 0.2s);
      }
      .splash-face + .splash-face + .splash-face {
        animation-delay: calc(var(--splash-delay, 0s) + 0.4s);
      }
      @keyframes splash-face {
        0%,
        100% {
          opacity: 0.35;
        }
        20%,
        55% {
          opacity: 1;
        }
      }
      .splash-name {
        margin: 16px 0 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
      }
      .splash-status {
        min-height: 20px;
        margin: 12px 0 0;
        color: var(--splash-muted);
        font-size: 14px;
        line-height: 20px;
      }
      .splash-title {
        margin: 24px 0 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
      }
      .splash-hint {
        max-width: 320px;
        margin: 8px 0 0;
        color: var(--splash-muted);
        font-size: 14px;
        line-height: 20px;
      }
      .splash-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-face {
          opacity: 1;
          animation: none;
        }
        .splash-leaving {
          animation-duration: 1ms;
        }
      }
    </style>
  </head>
