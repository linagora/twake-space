name: Check

on:
  workflow_call:
    inputs:
      project:
        description: Directory under apps/, e.g. "backend"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit
      - name: Start PostgreSQL for the backend tests
        if: inputs.project == 'backend'
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=twake_space -e POSTGRES_PASSWORD=twake_space -e POSTGRES_DB=twake_space \
            --health-cmd 'pg_isready -U twake_space' --health-interval 2s postgres:18
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
      - run: npm run check --workspace "@twake-space/${{ inputs.project }}"
